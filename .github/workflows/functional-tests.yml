name: "Functional Test"

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
  schedule:
    # 11:45 PM UTC every Sunday
    - cron: '45 23 * * 0'

env:
  SIMULATION: native
  ENABLE_UNIT_TESTS: false
  OMIT_DEPRECATED: true
  BUILDTYPE: release

jobs:
  Local-Test-Build:
    name: Build cFE
    runs-on: ubuntu-latest
    container: ghcr.io/core-flight-system/cfsbuildenv-linux:latest
    timeout-minutes: 15

    steps:
      - name: Checkout cFE
        uses: actions/checkout@v6
        with:
          path: cfe

      - name: Set up Dependencies
        uses: ./cfe/.github/actions/setup-cfe
        with:
          source-dir: .
          preferred-ref: ${{ github.head_ref }}
          org: 'nasa'

      # Setup the build system
      - name: Set up for build
        run: make prep

      - name: Build cFE
        run: make install

      - name: Generate Startup Link
        run: ln -s core-cpu1 ./build/exe/cpu1/container-start

      - name: List cpu1
        run: ls build/exe/cpu1/

      - name: Archive binaries
        run: |
          cd $GITHUB_WORKSPACE/build/exe
          find -maxdepth 1 -mindepth 1 -type d | while read dir
          do
            inst=$(basename ${dir})
            tar Jcv -f $GITHUB_WORKSPACE/${inst}-bin.tar.xz -C ${inst} .
          done

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-bin
          path: ./*.tar.xz

  Execute-Test:
    name: Execute Functional Test
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    needs: Local-Test-Build
    timeout-minutes: 15

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: functional-test-bin
          path: functional-test-bin

      - name: Unpack artifacts
        run: |
          for i in cpu1 host
          do
            mkdir -p "$i"
            tar Jxv -C "$i" -f "$GITHUB_WORKSPACE/functional-test-bin/$i-bin.tar.xz"
          done

      - name: List Files
        run: ls -lR .

      - name: Start CPU1 container
        id: start-cpu1
        uses: nasa/cFS/actions/start-cfs-container@dev
        with:
          binary-dir: ${{ github.workspace }}/cpu1
          exec-image: ghcr.io/core-flight-system/cfsbuildenv-linux:latest

      - name: Check CPU1 container
        id: check-cpu1
        uses: nasa/cFS/actions/healthcheck-logs@dev
        with:
          container-id: ${{ steps.start-cpu1.outputs.container-id }}
          healthcheck-regex: 'CFE_ES_Main entering OPERATIONAL state$'

      - name: Send No-Op Check
        working-directory: ./host
        env:
          CFE_HOST: ${{ steps.check-cpu1.outputs.ip-addr }}
        run: |
          ./cmd_send -v --host="${CFE_HOST}" --endian=LE --pktid=0x1806 --cmdcode=0
          sleep 2

      - name: Get container logs
        env:
          CONTAINER_ID: ${{ steps.start-cpu1.outputs.container-id }}
        run: |
          docker logs "${CONTAINER_ID}" | tee "${RUNNER_TEMP}/cfe_${CONTAINER_ID}.log"

      - name: Verify No-Op Receipt
        env:
          CONTAINER_ID: ${{ steps.start-cpu1.outputs.container-id }}
        run: |
          grep -A 2 'CFE_ES 3: No-op command' "${RUNNER_TEMP}/cfe_${CONTAINER_ID}.log"

      - name: Launch Functional Test
        working-directory: ./host
        env:
          CFE_HOST: ${{ steps.check-cpu1.outputs.ip-addr }}
          CONTAINER_ID: ${{ steps.start-cpu1.outputs.container-id }}
        run: |
          ./cmd_send -v --host="${CFE_HOST}" --pktid=0x1806 --cmdcode=4 --endian=LE --string="20:CFE_TEST" --string="20:CFE_TestMain" --string="64:cfe_testcase" --uint64=16384 --uint8=0 --uint8=0 --uint16=100 --uint32=0
          sleep 10

      - name: Wait for Functional Test
        working-directory: ./cpu1
        env:
          LIMIT: 3
        run: |
          counter=0
          stuck=0

          while [ ! -f cf/cfe_test.log ]
          do
            temp=$(grep -c "BEGIN" cf/cfe_test.tmp || echo 0)
            if [ $temp -eq $counter ]
            then
              let stuck=$stuck + 1
            else
              stuck=0
              counter=$temp
            fi

            if [ $stuck -ge "${LIMIT}" ]
            then
              echo "Test is frozen. Quitting"
              exit 1
            fi

            counter=$(grep -c "BEGIN" cf/cfe_test.tmp)
            echo "Waiting for CFE Tests"
            sleep 30
          done

      - name: Shut down CFE
        if: ${{ always() && steps.check-cpu1.outputs.ip-addr != '' }}
        working-directory: ./host
        env:
          CFE_HOST: ${{ steps.check-cpu1.outputs.ip-addr }}
        run: |
          ./cmd_send -v --host="$CFE_HOST" --endian=LE --pktid=0x1806 --cmdcode=2 --half=0x0002
          sleep 1

      - name: Stop CPU1 Container
        if: ${{ always() && steps.start-cpu1.outputs.container-id != '' }}
        uses: nasa/cFS/actions/stop-cfs-container@dev
        with:
          container-id: ${{ steps.start-cpu1.outputs.container-id }}

      - name: Get final container logs
        if: always()
        env:
          CONTAINER_ID: ${{ steps.start-cpu1.outputs.container-id }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/logs"
          cp -t "${GITHUB_WORKSPACE}/logs" cpu1/cf/*.log ||:
          docker logs "${CONTAINER_ID}" | tee "${GITHUB_WORKSPACE}/logs/cfe_full_output.log"

      - name: Archive cFS Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cFS-startup-log-deprecate-true-release
          path: logs/*

      - name: Check for cFS Warnings
        run: |
          if [[ -z $(grep -i "SUMMARY.*FAIL::0.*TSF::0.*TTF::0" cf/cfe_test.log) ]]; then
                  echo "Must resolve Test Failures in cFS Test App before submitting a pull request"
                  echo ""
                  grep -i '\[ FAIL]\|\[  TSF]\|\[  TTF]' cf/cfe_test.log
                  exit -1
          fi
        working-directory: ./cpu1/